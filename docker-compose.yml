services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      TRIAGEPILOT_THRESHOLD: "0.72"
      TRIAGEPILOT_SAMPLE_COUNT: "5"
      TRIAGEPILOT_CORRECTIONS_PATH: "/app/data/corrections.jsonl"
    volumes:
      - triagepilot-data:/app/data  # persist the human-correction log across container restarts

volumes:
  triagepilot-data:

